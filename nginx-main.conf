# Contoh nginx untuk https://pantau-bekasi.com. Konfigurasi di server belum pernah masuk repo: bandingkan dulu dengan
# /etc/nginx/sites-available di server sebelum memakainya, lalu `sudo nginx -t && sudo systemctl reload nginx`.

# Batas login per IP, dilapis di atas kunci 10x salah di aplikasi. Nama zone beda dari nginx-admin.conf.
limit_req_zone $binary_remote_addr zone=pantau_main_login:10m rate=10r/m;

server {
    listen 80;
    server_name pantau-bekasi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pantau-bekasi.com;

    ssl_certificate     /etc/letsencrypt/live/pantau-bekasi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pantau-bekasi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Header ini dibaca uvicorn (percaya 127.0.0.1) supaya kunci login per IP asli, bukan 127.0.0.1.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # Backend mati/terlalu lama: halaman PANTAU sendiri, bukan halaman bawaan nginx.
    error_page 502 504 /pantau-error.html;
    location = /pantau-error.html {
        alias /var/www/pantau/web/shared/error.html;
        internal;
    }

    # Admin hanya lewat admin.pantau-bekasi.com: di sini dijawab halaman "tidak ditemukan" dari aplikasi.
    location /admin { proxy_pass http://127.0.0.1:8000/tidak-ditemukan; }
    location /api/admin/ { proxy_pass http://127.0.0.1:8000/api/tidak-ditemukan; }

    location ~ ^/api/(karyawan|ppu-pn)/login$ {
        limit_req zone=pantau_main_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
