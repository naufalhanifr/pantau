<!-- DETAIL BADAN USAHA -->
<div aria-labelledby="businessDetailTitle" aria-modal="true" class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-900/45 p-4" id="businessDetailModal" onclick="if(event.target===this) closeBusinessDetail()" role="dialog">
<div class="w-full max-w-4xl max-h-[90vh] overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl flex flex-col" onclick="event.stopPropagation()">
<div class="flex items-start justify-between gap-4 border-b border-slate-200 px-5 py-4 sm:px-6" style="border-radius:16px 16px 0 0 !important; border-bottom-left-radius:0 !important; border-bottom-right-radius:0 !important;">
<div class="min-w-0">
<h2 class="text-xl sm:text-2xl font-bold text-slate-900" id="businessDetailTitle">Detail Badan Usaha</h2>
<p class="mt-1 text-sm text-slate-500" id="businessDetailCode">Kode BU: -</p>
</div>
<button aria-label="Tutup detail" class="shrink-0 rounded-lg p-2 text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition" onclick="closeBusinessDetail()" type="button">
<i class="fa-solid fa-xmark text-lg"></i>
</button>
</div>
<div class="overflow-y-auto px-5 py-5 sm:px-6">
<div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="businessDetailSummary">
<div class="summary-card bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 transition relative overflow-hidden min-w-0">
<div class="flex items-center gap-2 min-h-8"><div class="w-8 h-8 shrink-0 bg-indigo-600 text-white rounded-lg flex items-center justify-center text-sm"><i class="fa-solid fa-wallet"></i></div><p class="text-sm font-semibold uppercase tracking-wide text-slate-500">Total Tagihan</p></div>
<p class="mt-5 text-xl lg:text-2xl font-extrabold text-slate-900" id="businessDetailTagihan">Rp0</p>
</div>
<div class="summary-card bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 transition relative overflow-hidden min-w-0">
<div class="flex items-center gap-2 min-h-8"><div class="w-8 h-8 shrink-0 bg-emerald-600 text-white rounded-lg flex items-center justify-center text-sm"><i class="fa-solid fa-hand-holding-dollar"></i></div><p class="text-sm font-semibold uppercase tracking-wide text-slate-500">Total Pembayaran</p></div>
<p class="mt-5 text-xl lg:text-2xl font-extrabold text-slate-900" id="businessDetailBayar">Rp0</p>
</div>
<div class="summary-card bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 transition relative overflow-hidden min-w-0">
<div class="flex items-center gap-2 min-h-8"><div class="w-8 h-8 shrink-0 bg-rose-500 text-white rounded-lg flex items-center justify-center text-sm"><i class="fa-solid fa-file-circle-exclamation"></i></div><p class="text-sm font-semibold uppercase tracking-wide text-slate-500">Sisa Tagihan</p></div>
<p class="mt-5 text-xl lg:text-2xl font-extrabold text-slate-900" id="businessDetailSisa">Rp0</p>
</div>
</div>
<div class="mt-5 pt-1">
<div class="mb-3 flex flex-col gap-1 sm:flex-row sm:items-end sm:justify-between">
<h3 class="text-base font-bold text-slate-900">Riwayat Tagihan &amp; Pembayaran</h3>
<p class="text-sm text-slate-500" id="businessDetailPeriod">Periode -</p>
</div>
<div id="businessDetailTableScroll" class="overflow-x-auto rounded-none" style="border-radius: 0px !important; -webkit-border-radius: 0px !important;">
<table class="pantau-table w-full min-w-[520px] text-left border-collapse">
<thead><tr><th class="text-slate-500">Periode</th><th class="text-right text-indigo-600">Tagihan</th><th class="text-right text-emerald-600">Pembayaran</th><th class="text-right text-rose-600">Sisa Tagihan</th></tr></thead>
<tbody id="businessDetailHistory"><tr><td class="px-3 py-8 text-center text-slate-400" colspan="4">Pilih badan usaha untuk melihat riwayat.</td></tr></tbody>
</table>
</div>
</div>
</div>
<div class="flex justify-end border-t border-slate-200 bg-slate-50 px-5 py-3 sm:px-6" style="border-radius: 0 0 8px 8px !important; border-top-left-radius: 0 !important; border-top-right-radius: 0 !important; border-bottom-left-radius: 8px !important; border-bottom-right-radius: 8px !important;">
<button class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 transition" onclick="closeBusinessDetail()" type="button">Tutup</button>
</div>
</div>
</div>
