<!-- HEADER: clean minimalist -->
<header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm" id="appHeader">
<div class="w-full px-3 sm:px-4 lg:px-5 py-3">
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
<div class="flex items-center gap-3 min-w-0">
<div class="h-12 w-12 shrink-0 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-md shadow-emerald-100">
<i class="fa-solid fa-chart-line text-white text-xl">
</i>
</div>
<div class="min-w-0 flex flex-col items-start gap-0.5">
<h1 class="text-2xl font-extrabold tracking-tight text-slate-900 leading-tight">
        PANTAU
       </h1>
<span class="text-xs sm:text-sm font-semibold text-emerald-700 leading-tight">
        Pemantauan Pembayaran Iuran BPJS Kesehatan KC Bekasi
       </span>
</div>
</div>
<div class="flex items-center justify-between sm:justify-end gap-3">
<div class="hidden sm:block text-right">
<p class="text-xs font-semibold text-slate-600" id="clockDate">
        Memuat tanggal...
       </p>
<p class="text-lg font-bold tracking-tight text-emerald-700 tabular-nums" id="clockTime">
        --:--:-- WIB
       </p>
</div>
<div class="sm:hidden flex items-center gap-2 rounded-xl border border-emerald-100 bg-emerald-50 px-3 py-2">
<i class="fa-regular fa-clock text-emerald-700">
</i>
<div>
<p class="text-[11px] font-semibold text-slate-600" id="clockDateMobile">
         Memuat tanggal...
        </p>
<p class="text-sm font-bold text-emerald-700 tabular-nums" id="clockTimeMobile">
         --:--:-- WIB
        </p>
</div>
</div>
</div>
</div>
</div>
</header>
