<section class="admin-login" id="adminLogin">
  <div class="pantau-login-card">
    <div class="pantau-login-icon"><i class="fa-solid fa-user-shield" aria-hidden="true"></i></div>
    <h1>Masuk PANTAU Admin</h1>
    <p class="pantau-login-description">Kelola data tagihan, pembayaran, dan karyawan yang tampil di web monitoring.</p>
    <form autocomplete="off" onsubmit="return adminLogin(event)">
      <label class="pantau-login-label" for="adminPassword">Kata sandi admin</label>
      <label class="pantau-password-wrap" for="adminPassword">
        <input id="adminPassword" type="password" placeholder="Masukkan kata sandi admin" autocomplete="current-password" required/>
        <button class="pantau-password-toggle" type="button" aria-label="Tampilkan kata sandi" onclick="toggleAdminPassword()"><i id="adminPasswordEye" class="fa-solid fa-eye"></i></button>
      </label>
      <p class="pantau-login-error hidden" id="adminLoginError" role="alert">Kata sandi tidak sesuai.</p>
      <button class="pantau-login-submit" type="submit"><span>Masuk</span></button>
    </form>
    <div class="pantau-login-footer"><i class="fa-solid fa-shield-halved"></i><span>Data Internal BPJS Kesehatan KC Bekasi</span></div>
  </div>
</section>
