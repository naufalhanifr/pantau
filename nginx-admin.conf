# Nginx untuk https://admin.pantau-bekasi.com -> /etc/nginx/sites-available/pantau-admin
# Hanya path yang dipakai halaman admin yang diteruskan ke aplikasi; path lain 404.

# Batas login per IP, dilapis di atas kunci 5x salah di aplikasi.
limit_req_zone $binary_remote_addr zone=pantau_login:10m rate=5r/m;

server {
    listen 80;
    server_name admin.pantau-bekasi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.pantau-bekasi.com;

    ssl_certificate     /etc/letsencrypt/live/admin.pantau-bekasi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.pantau-bekasi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;      # TLS 1.2/1.3 saja
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Paling ketat: batasi ke IP kantor, buka komentar dan isi IP-nya.
    # allow 203.0.113.10;
    # deny all;

    # Header ini dibaca uvicorn (percaya 127.0.0.1) supaya kunci login di aplikasi per IP asli, bukan 127.0.0.1.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = / {
        proxy_pass http://127.0.0.1:8000/admin;
    }
    # /admin sengaja tidak ada: halaman admin hanya di "/", jadi /admin jatuh ke 404 di bawah.
    location /admin/assets/ {
        proxy_pass http://127.0.0.1:8000;
    }
    location /shared/ {
        proxy_pass http://127.0.0.1:8000;
    }
    location = /api/admin/login {
        limit_req zone=pantau_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /api/admin/upload {
        client_max_body_size 50m;   # = MAX_UPLOAD_BYTES di backend/config.py
        proxy_pass http://127.0.0.1:8000;
    }
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        return 404;
    }
}
